<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Terzme.store</title>
  <style>
    body {
      margin: 0;
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .loader {
      border: 3px solid rgba(255,255,255,0.1);
      border-top: 3px solid #d4af37;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    button {
      margin-top: 15px;
      padding: 10px 24px;
      background: #d4af37;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="loader"></div>
  <h2>TERZME.STORE</h2>
  <p>Yüklənir... İnternet bağlantınızı yoxlayın.</p>
  <button onclick="window.location.href='https://terzme.store'">Yenidən yoxla</button>
</body>
</html>
